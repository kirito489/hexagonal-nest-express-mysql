# =============================================================================
# 本機重現 CI 的 e2e 測試環境
# -----------------------------------------------------------------------------
# 用途：CI 設定（.gitlab-ci.yml 的 e2e-test job）改動後，不必推送就能在本機驗證
# 等價的測試能否通過。
#
# 與 GitLab CI 的差異（刻意保留）：
#   - 這裡用 compose 的 healthcheck + depends_on 等 MySQL 就緒（宣告式、由 daemon 重試）；
#     GitLab 的 services 不支援此語法，CI 端沿用手動等待迴圈。
#   - tmpfs 讓測試庫跑在記憶體：快且免清理（CI 的 service container 本來就是拋棄式）。
#
# 定位是「測試環境重現」而非「pipeline 模擬」——runner 行為與 cache 命中仍只能在
# 實際 pipeline 觀察。
#
# 用法：pnpm verify:ci
# =============================================================================
services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: verify-secret
      MYSQL_DATABASE: hexagonal_verify_test
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pverify-secret']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    ports:
      # 對外用非預設埠，避免與本機既有的 MySQL 3306 衝突
      - '13306:3306'
