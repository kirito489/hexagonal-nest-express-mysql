tags: [Security]
summary: 查詢 IP 黑名單
description: 取得所有 IP 黑名單記錄（僅限 ADMIN）。

security:
  - bearerAuth: []

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
        example:
          success: true
          data:
            - ip: 10.0.0.1
              reason: 異常登入嘗試
              createdAt: '2024-01-01T00:00:00.000Z'
          timestamp: '2024-01-01T00:00:00.000Z'

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'

  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
