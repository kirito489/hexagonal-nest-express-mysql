tags: [Auth]
summary: 重設密碼
description: |
  使用密碼重設 Token 設定新密碼。Token 為單次使用，過期後失效。

security: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, newPassword]
        properties:
          token:
            type: string
            description: 密碼重設 Token（來自信件連結）
            example: abc123def456
          newPassword:
            type: string
            format: password
            description: 新密碼
            example: NewPassword123!

responses:
  '200':
    description: 密碼重設成功
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/SuccessResponse'
        example:
          success: true
          data:
            message: 密碼已成功重設
          timestamp: '2024-01-01T00:00:00.000Z'

  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'

  '401':
    description: Token 無效或已過期
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
        example:
          success: false
          message: 密碼重設連結無效或已過期
          code: INVALID_RESET_TOKEN
          timestamp: '2024-01-01T00:00:00.000Z'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
