openapi: 3.0.0
info:
  title: Hexagonal NestJS API
  version: 1.0.0
  description: |
    Hexagonal Architecture NestJS + Express API 文件
servers:
  - url: 'http://localhost:3000/api'
    description: 本地開發環境
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        使用 Access Token 進行身份驗證

        格式: Bearer {accessToken}
  schemas:
    SuccessResponse:
      type: object
      description: 通用成功回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: true
        data:
          type: object
          description: 回應資料
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
    ErrorResponse:
      type: object
      description: 通用錯誤回應格式
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: 操作是否成功
          example: false
        message:
          type: string
          description: 錯誤訊息
          example: 發生錯誤
        code:
          type: string
          description: 錯誤代碼
          example: ERROR_CODE
        timestamp:
          type: string
          format: date-time
          description: 回應時間
          example: '2024-01-01T00:00:00.000Z'
  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 請求參數錯誤
            code: BAD_REQUEST
            timestamp: '2024-01-01T00:00:00.000Z'
    NoToken:
      description: 缺少授權憑證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 缺少授權憑證，請先登入
            code: NO_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenRevoked:
      description: Token 已登出或失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已登出或失效
            code: TOKEN_REVOKED
            timestamp: '2024-01-01T00:00:00.000Z'
    TokenExpired:
      description: Token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 已過期
            code: TOKEN_EXPIRED
            timestamp: '2024-01-01T00:00:00.000Z'
    InvalidToken:
      description: Token 無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Token 無效
            code: INVALID_TOKEN
            timestamp: '2024-01-01T00:00:00.000Z'
    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 權限不足
            code: FORBIDDEN
            timestamp: '2024-01-01T00:00:00.000Z'
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源不存在
            code: NOT_FOUND
            timestamp: '2024-01-01T00:00:00.000Z'
    Conflict:
      description: 資源已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 資源已存在
            code: CONFLICT
            timestamp: '2024-01-01T00:00:00.000Z'
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: 伺服器發生未預期錯誤
            code: INTERNAL_SERVER_ERROR
            timestamp: '2024-01-01T00:00:00.000Z'
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 登入
      description: |
        使用 Email 與密碼登入，成功後取得 JWT Access Token 與 Refresh Token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
                password:
                  type: string
                  format: password
                  description: 密碼
                  example: mypassword123
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 登入結果
                    required:
                      - accessToken
                      - refreshToken
                      - accessTokenExpiresIn
                      - refreshTokenExpiresIn
                      - member
                    properties:
                      accessToken:
                        type: string
                        description: Access Token
                      refreshToken:
                        type: string
                        description: Refresh Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                      member:
                        type: object
                        description: 帳號摘要
                        required:
                          - id
                          - email
                          - member
                          - roleName
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: 帳號 ID
                          email:
                            type: string
                            format: email
                            description: Email
                          member:
                            type: string
                            description: 名稱
                          roleName:
                            type: string
                            description: 所屬角色名稱
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 900
                  refreshTokenExpiresIn: 604800
                  member:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: test@example.com
                    member: Alan
                    roleName: ADMIN
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: 帳號或密碼錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 帳號或密碼錯誤
                code: UNAUTHORIZED
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 登出
      description: |
        登出並將 Access Token 加入黑名單。
        若同時傳入 Refresh Token，也會一併加入黑名單。
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token（選填，一併廢棄）
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: 登出成功（無回應內容）
        '401':
          $ref: '#/components/responses/NoToken'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 更新 Access Token
      description: |
        使用 Refresh Token 取得新的 Access Token 與新的 Refresh Token（rotation）。
        舊 Refresh Token 會立即加入黑名單；如果同一個舊 Refresh Token 再次被用 → 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: 更新後的 token 雙包
                    required:
                      - accessToken
                      - accessTokenExpiresIn
                      - refreshToken
                      - refreshTokenExpiresIn
                    properties:
                      accessToken:
                        type: string
                        description: 新的 Access Token
                      accessTokenExpiresIn:
                        type: integer
                        description: Access Token 絕對有效期（秒）
                      refreshToken:
                        type: string
                        description: 新的 Refresh Token（舊 token 已加入黑名單）
                      refreshTokenExpiresIn:
                        type: integer
                        description: Refresh Token 絕對有效期（秒）
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  accessTokenExpiresIn: 7200
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshTokenExpiresIn: 604800
                timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          description: Refresh Token 無效或已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Refresh Token 無效
                code: INVALID_REFRESH_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 忘記密碼
      description: |
        傳送密碼重設信件。無論 Email 是否存在，回應皆相同（防止帳號列舉）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 電子郵件
                  example: test@example.com
      responses:
        '200':
          description: 請求已接受
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        description: 顯示給使用者的提示訊息
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  message: 若此信箱已註冊，您將收到密碼重設信件
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 重設密碼
      description: |
        使用密碼重設 Token 設定新密碼。Token 為單次使用，過期後失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: 密碼重設 Token（來自信件連結）
                  example: abc123def456
                newPassword:
                  type: string
                  format: password
                  description: 新密碼
                  example: NewPassword123!
      responses:
        '200':
          description: 密碼重設成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        description: 顯示給使用者的提示訊息
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  message: 密碼已成功重設
                timestamp: '2024-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token 無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 密碼重設連結無效或已過期
                code: INVALID_RESET_TOKEN
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /roles:
    get:
      tags:
        - Roles
      summary: 角色列表
      description: |
        分頁取得角色列表，支援名稱模糊搜尋。需要 `BACKEND:ROLE:VIEW` 權限。
        需要 JWT Bearer Token 認證。
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: 以名稱模糊搜尋
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: 管理者
                            status:
                              type: boolean
                            isDefault:
                              type: boolean
                              description: 預設角色（true 時不可刪除/編輯）
                            memberCount:
                              type: integer
                              description: 使用此角色的帳號數
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Roles
      summary: 建立角色
      description: |
        建立新角色並指派 permissions。名稱不可重複，permissionCodes 須存在於 DB。
        EDIT permission 必須搭配對應 VIEW。需要 `BACKEND:ROLE:EDIT` 權限。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: 審核人員
                permissionCodes:
                  type: array
                  items:
                    type: string
                    pattern: '^[A-Z_]+:[A-Z_]+:(VIEW|EDIT)$'
                  default: []
                  example:
                    - 'BACKEND:ACCOUNT:VIEW'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: 參數錯誤或 permission code 格式/組合不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  summary: Permission code 不存在
                  value:
                    success: false
                    message: 'Permission code 不存在：BACKEND:XXX:VIEW'
                    code: INVALID_PERMISSION_CODE
                    timestamp: '2024-01-01T00:00:00.000Z'
                invalidCombination:
                  summary: EDIT 未搭配 VIEW
                  value:
                    success: false
                    message: '設定 BACKEND:ACCOUNT:EDIT 時必須同時設定 BACKEND:ACCOUNT:VIEW'
                    code: INVALID_PERMISSION_COMBINATION
                    timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 角色名稱已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 角色名稱已存在：審核人員
                code: DUPLICATE_ROLE_NAME
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /roles/permissions:
    get:
      tags:
        - Roles
      summary: 可用 Permission 清單
      description: |
        取得系統中所有啟用的 permission（status=true），供角色建立/編輯 Modal 使用。
        需要 `BACKEND:ROLE:VIEW` 權限。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        permissionCode:
                          type: string
                          example: 'BACKEND:ACCOUNT:VIEW'
                        name:
                          type: string
                          example: 帳號檢視
                        platform:
                          type: string
                          example: BACKEND
                        module:
                          type: string
                          example: ACCOUNT
                        action:
                          type: string
                          example: VIEW
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  '/roles/{id}':
    get:
      tags:
        - Roles
      summary: 角色詳情
      description: |
        取得單一角色詳情，包含已指派的 permissionCodes。需要 `BACKEND:ROLE:VIEW` 權限。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: boolean
                      isDefault:
                        type: boolean
                      permissionCodes:
                        type: array
                        items:
                          type: string
                        example:
                          - 'BACKEND:ROLE:VIEW'
                          - 'BACKEND:ROLE:EDIT'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  timestamp:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 找不到角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 角色不存在
                code: ROLE_NOT_FOUND
                timestamp: '2024-01-01T00:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Roles
      summary: 更新角色
      description: |
        更新角色名稱、permissions 或啟用狀態。三者均為選填（省略表示不變更）。
        permissionCodes 傳空陣列 `[]` 表示清空所有權限。預設角色不可編輯。
        需要 `BACKEND:ROLE:EDIT` 權限。
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                permissionCodes:
                  type: array
                  items:
                    type: string
                    pattern: '^[A-Z_]+:[A-Z_]+:(VIEW|EDIT)$'
                  description: 省略表示不變更；傳空陣列表示清空所有權限
                status:
                  type: boolean
                  description: 省略表示不變更；傳 true/false 切換角色啟用狀態
      responses:
        '204':
          description: 更新成功（無 body）
        '400':
          description: 參數錯誤、預設角色不可編輯或 permission 組合不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                defaultRoleNotEditable:
                  summary: 預設角色不可編輯
                  value:
                    success: false
                    message: 預設角色不可編輯
                    code: DEFAULT_ROLE_NOT_EDITABLE
                    timestamp: '2024-01-01T00:00:00.000Z'
                invalidCode:
                  summary: Permission code 不存在
                  value:
                    success: false
                    message: 'Permission code 不存在：BACKEND:XXX:VIEW'
                    code: INVALID_PERMISSION_CODE
                    timestamp: '2024-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/NoToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 找不到角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 角色不存在
                code: ROLE_NOT_FOUND
                timestamp: '2024-01-01T00:00:00.000Z'
        '409':
          description: 角色名稱已存在
          content:
