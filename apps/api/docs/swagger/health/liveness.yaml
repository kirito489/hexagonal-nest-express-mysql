tags: [Health]
summary: 存活探針（liveness）
description: |
  確認 API 行程是否存活，永遠輕量回 200，不檢查任何外部依賴。
  供 k8s livenessProbe / 負載平衡器存活檢查使用。無需認證。

responses:
  '200':
    description: 行程存活
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required: [status, timestamp]
              properties:
                status:
                  type: string
                  description: 固定為 ok
                  example: ok
                timestamp:
                  type: string
                  format: date-time
                  description: 探針回應時間
            timestamp:
              type: string
              format: date-time
        example:
          success: true
          data:
            status: ok
            timestamp: '2024-01-01T00:00:00.000Z'
          timestamp: '2024-01-01T00:00:00.000Z'
