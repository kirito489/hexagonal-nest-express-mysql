tags: [Auth]
summary: 忘記密碼
description: |
  傳送密碼重設信件。無論 Email 是否存在，回應皆相同（防止帳號列舉）。

security: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email:
            type: string
            format: email
            description: 電子郵件
            example: test@example.com

responses:
  '200':
    description: 請求已接受
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: 顯示給使用者的提示訊息
            timestamp:
              type: string
              format: date-time
        example:
          success: true
          data:
            message: 若此信箱已註冊，您將收到密碼重設信件
          timestamp: '2024-01-01T00:00:00.000Z'

  '400':
    $ref: '../openapi.yaml#/components/responses/BadRequest'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
