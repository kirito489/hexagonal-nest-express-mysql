tags: [FrontAuth]
summary: 前台忘記密碼
description: |
  對存在的帳號寄出密碼重設信。

  **帳號不存在時靜默回傳相同的回應**，且不在 log 記錄該 email
  ——log 會累積成一份「哪些信箱未註冊」的列舉資料。

  受 IP 與信箱兩層節流。

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email]
        properties:
          email: { type: string, format: email }

responses:
  '204':
    description: 已受理（無回應內容；不代表該帳號存在）
  '400':
    description: 欄位驗證失敗
  '429':
    description: 超過節流上限
