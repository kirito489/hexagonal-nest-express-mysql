tags: [FrontAuth]
summary: 前台登入
description: |
  驗證前台使用者帳密並簽發 token 組。

  **前台與後台使用各自的 JWT secret**——本端點簽出的 token 無法通過後台的守衛，
  反之亦然。payload 帶 `side: 'front'` 作為第二道識別。

  帳號不存在與密碼錯誤回**完全相同**的 401，避免本端點變成帳號列舉工具。

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [email, password]
        properties:
          email:
            type: string
            format: email
          password:
            type: string

responses:
  '200':
    description: 登入成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: object
              required:
                [
                  accessToken,
                  refreshToken,
                  accessTokenExpiresIn,
                  refreshTokenExpiresIn,
                  user,
                ]
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                accessTokenExpiresIn:
                  type: integer
                refreshTokenExpiresIn:
                  type: integer
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      format: email
                    displayName:
                      type: string
                    emailVerified:
                      type: boolean
            timestamp:
              type: string
              format: date-time

  '400':
    description: 欄位驗證失敗
  '401':
    description: 帳號或密碼錯誤（兩者回應完全相同）
  '403':
    description: 帳號已停用
