openapi: 3.0.0
info:
  title: Hexagonal NestJS 前台 (Front) API
  version: 1.0.0
  description: |
    前台 API 文件。認證端點在 `/auth/*`，個人資料在 `/me`。
    其餘前台端點以 `gen:module <name> --front` 產生後補進本文件。

    **前台與後台使用各自的 JWT secret**：本文件簽出的 token 無法通過後台守衛，反之亦然。
servers:
  - url: 'http://localhost:3000/api/front'
    description: 本地開發環境（前台 API）
components:
  securitySchemes:
    frontBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 前台的 access token（以 FRONT_ACCESS_SECRET 簽發）
paths:
  /ping:
    get:
      tags:
        - Front
      summary: 前台健康探測（骨架示範）
      description: |
        公開端點，回傳前台 API 存活訊息，用於驗證 /api/front 路由與前台 swagger 骨架。
        無需認證。實際前台功能以 gen:module --front 產生。
      responses:
        '200':
          description: 前台 API 存活
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: 前台 API 運作中
                  timestamp:
                    type: string
                    format: date-time
              example:
                success: true
                data:
                  message: 前台 API 運作中
                timestamp: '2024-01-01T00:00:00.000Z'
  /auth/login:
    post:
      tags:
        - FrontAuth
      summary: 前台登入
      description: |
        驗證前台使用者帳密並簽發 token 組。

        **前台與後台使用各自的 JWT secret**——本端點簽出的 token 無法通過後台的守衛，
        反之亦然。payload 帶 `side: 'front'` 作為第二道識別。

        帳號不存在與密碼錯誤回**完全相同**的 401，避免本端點變成帳號列舉工具。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - accessToken
                      - refreshToken
                      - accessTokenExpiresIn
                      - refreshTokenExpiresIn
                      - user
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      accessTokenExpiresIn:
                        type: integer
                      refreshTokenExpiresIn:
                        type: integer
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          displayName:
                            type: string
                          emailVerified:
                            type: boolean
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: 欄位驗證失敗
        '401':
          description: 帳號或密碼錯誤（兩者回應完全相同）
        '403':
          description: 帳號已停用
  /auth/refresh:
    post:
      tags:
        - FrontAuth
      summary: 前台 Token 更新
      description: |
        以 refresh token 換發新的 token 組。

        MUST 通過 `type === 'refresh'`、`side === 'front'` 與 `tokenVersion` 三項比對；
        登出會遞增 `tokenVersion`，因此登出後的舊 token 立即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 換發成功；回應結構與登入相同
        '400':
          description: 欄位驗證失敗
        '401':
          description: token 無效、過期、類型不符、側別不符或已被撤銷
  /auth/logout:
    post:
      tags:
        - FrontAuth
      summary: 前台登出
      description: |
        遞增 `tokenVersion`，使該帳號**所有裝置**的既發 token 立即失效。

        需要前台的 access token。
      security:
        - frontBearerAuth: []
      responses:
        '204':
          description: 登出成功（無回應內容）
        '401':
          description: 未帶 token 或 token 無效
  /auth/register:
    post:
      tags:
        - FrontAuth
      summary: 前台註冊
      description: |
        建立一個**未驗證**的前台帳號並寄出驗證信。

        ⚠️ **信箱已存在時回應與成功完全相同，且不會建立帳號**——
        回 409「此信箱已註冊」是帳號列舉，任何人都能拿一份信箱清單問出誰有帳號。
        此時改寄一封「你的信箱已有帳號」的信給既有擁有者。

        受 **IP 節流（3 次 / 分鐘）與信箱節流**兩層保護。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  description: 長度與複雜度依 APPLICATION_PASSWORD_* 設定
                displayName:
                  type: string
                  maxLength: 50
      responses:
        '201':
          description: 註冊成功（信箱已存在時亦回此回應）
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: 欄位驗證失敗，或密碼不符政策
        '429':
          description: 超過 IP 或信箱的節流上限
  /auth/verify-email:
    get:
      tags:
        - FrontAuth
      summary: 驗證信箱
      description: |
        消耗驗證 token 並寫入 `emailVerifiedAt`。

        ⚠️ **本端點回 302 導回前台，不回 JSON**——這個網址是使用者在信件裡點的，
        開啟的是瀏覽器。**失敗也導回**（不回 4xx）：一個瀏覽器錯誤頁對他沒有意義。

        導向 `${APP_FRONT_URL}${APP_FRONT_VERIFY_REDIRECT_PATH}?status=<status>`，
        `status` 為 `success` / `invalid` / `expired`，供前台決定下一步（重寄 vs 去登入）。
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 導回前台，結果以 query 的 status 帶回
          headers:
            Location:
              schema:
                type: string
              description: '例 `http://front.example/verify-email?status=success`'
        '400':
          description: 缺少 token
  /auth/resend-verification:
    post:
      tags:
        - FrontAuth
      summary: 重發驗證信
      description: |
        對未驗證的帳號重寄驗證信，並作廢該帳號既有未使用的驗證 token
        ——兩枚同時有效的連結沒有意義，而舊的那枚會在信箱裡留更久。

        **帳號不存在或已完成驗證時回相同的回應且不寄信**（防帳號列舉）。
        受 IP 與信箱兩層節流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: 已受理（無回應內容；不代表一定寄出了信）
        '400':
          description: 欄位驗證失敗
        '429':
          description: 超過節流上限
  /auth/forgot-password:
    post:
      tags:
        - FrontAuth
      summary: 前台忘記密碼
      description: |
        對存在的帳號寄出密碼重設信。

        **帳號不存在時靜默回傳相同的回應**，且不在 log 記錄該 email
        ——log 會累積成一份「哪些信箱未註冊」的列舉資料。

        受 IP 與信箱兩層節流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: 已受理（無回應內容；不代表該帳號存在）
        '400':
          description: 欄位驗證失敗
        '429':
          description: 超過節流上限
  /auth/reset-password:
    post:
      tags:
        - FrontAuth
      summary: 前台重設密碼
      description: |
        以 token 設定新密碼。成功後會**遞增 `tokenVersion`**，
        使該帳號所有既發的 JWT 立即失效，並作廢其他未使用的重設 token。

        密碼政策在消耗 token **之前**檢查：反過來的話 token 會被用掉，
        而使用者只是密碼打太短，卻得重新申請一封信。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '204':
          description: 重設成功（無回應內容）
        '400':
          description: token 無效／已使用／已過期／用途不符，或新密碼不符政策
        '429':
          description: 超過節流上限
  /me:
    get:
      tags:
        - FrontMe
      summary: 前台個人資料
      description: |
        回傳目前登入的前台使用者。

        含 `emailVerified`，前台可據此提示使用者去完成信箱驗證。
      security:
        - frontBearerAuth: []
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      displayName:
                        type: string
                      emailVerified:
                        type: boolean
                      lastLoginAt:
                        type: string
                        format: date-time
                        nullable: true
                  timestamp:
                    type: string
                    format: date-time
        '401':
          description: 未帶 token 或 token 無效
