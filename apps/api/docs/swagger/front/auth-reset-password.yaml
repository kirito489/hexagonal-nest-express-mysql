tags: [FrontAuth]
summary: 前台重設密碼
description: |
  以 token 設定新密碼。成功後會**遞增 `tokenVersion`**，
  使該帳號所有既發的 JWT 立即失效，並作廢其他未使用的重設 token。

  密碼政策在消耗 token **之前**檢查：反過來的話 token 會被用掉，
  而使用者只是密碼打太短，卻得重新申請一封信。

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [token, newPassword]
        properties:
          token: { type: string }
          newPassword: { type: string }

responses:
  '204':
    description: 重設成功（無回應內容）
  '400':
    description: token 無效／已使用／已過期／用途不符，或新密碼不符政策
  '429':
    description: 超過節流上限
