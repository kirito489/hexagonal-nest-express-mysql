tags: [Security]
summary: 查詢 IP 黑名單
description: 取得所有 IP 黑名單記錄（僅限 ADMIN）。

security:
  - bearerAuth: []

responses:
  '200':
    description: 查詢成功
    content:
      application/json:
        schema:
          type: object
          required: [success, data, timestamp]
          properties:
            success:
              type: boolean
              example: true
            data:
              type: array
              description: IP 黑名單清單
              items:
                type: object
                required: [id, ipAddress, isAutoBlock, createdAt]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: 紀錄 ID
                  ipAddress:
                    type: string
                    description: IP 位址
                  reason:
                    type: string
                    nullable: true
                    description: 封鎖原因
                  isAutoBlock:
                    type: boolean
                    description: 是否為系統自動封鎖
                  createdBy:
                    type: string
                    format: uuid
                    nullable: true
                    description: 建立者帳號 ID
                  createdAt:
                    type: string
                    format: date-time
                    description: 建立時間（UTC）
            timestamp:
              type: string
              format: date-time
        example:
          success: true
          data:
            - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              ipAddress: 10.0.0.1
              reason: 異常登入嘗試
              isAutoBlock: false
              createdBy: b1b2c3d4-e5f6-7890-abcd-ef1234567890
              createdAt: '2024-01-01T00:00:00.000Z'
          timestamp: '2024-01-01T00:00:00.000Z'

  '401':
    $ref: '../openapi.yaml#/components/responses/NoToken'

  '403':
    $ref: '../openapi.yaml#/components/responses/Forbidden'

  '500':
    $ref: '../openapi.yaml#/components/responses/InternalServerError'
