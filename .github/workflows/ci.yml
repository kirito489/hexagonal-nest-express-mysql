# 品質關卡（GitHub Actions）
#
# 與 `.gitlab-ci.yml` **並存**：fork 這個模板之後刪掉不用的那一份。
# 兩份跑的是同一組檢查，由 `ci-parity.spec.ts` 守著——
# CI 設定的錯誤方式全是靜默的（漏了 test:cov 只是覆蓋率門檻不執行），
# 所以一致性交給機器盯。
#
# 規則細節見 openspec/specs/platform-ci-quality-gate/spec.md。
#
# ⚠️ 本 workflow 只負責「執行檢查並回報」。要讓失敗真的擋住合併，
# 必須在 repo Settings → Branches 把 quality 與 e2e 設為 required status checks——
# **那項設定不在版控內**。GitHub 免費方案的私有 repo 甚至設不了
# （branch protection 與 ruleset 皆回 403）。

name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# 同一分支連續推送時取消尚未跑完的舊 run，避免排隊等待已經過時的結果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # git hook 在 CI 沒有意義，且 husky 在無 .git hooks 目錄時會噪音
  HUSKY: '0'
  # typecheck / lint 的 pre script 會跑 db:generate，需要 DB_* 組出 DATABASE_URL。
  # generate 不連線，但 prisma.config.ts 仍要拼出合法的 URL 字串
  DB_HOST: localhost
  DB_PORT: '3306'
  DB_USERNAME: root
  DB_PASSWORD: ci-e2e-root
  DB_DATABASE: hexagonal_e2e_test
  AWS_MEDIA_LIBRARY_ROOT: local

jobs:
  # 型別 / lint / 單元測試 + 覆蓋率門檻 + 架構守則。不需外部服務，
  # 多數問題在此於數十秒內回報，開發者不必等 e2e 的資料庫起來
  quality:
    name: 品質檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - run: pnpm typecheck
      - run: pnpm lint

      # 必須是 test:cov 不是 test——四個覆蓋率門檻只在前者執行，
      # 用 test 會讓門檻靜默失效（那正是 platform-ci-quality-gate 要防的事）
      - name: 單元測試 + 覆蓋率門檻 + 架構守則
        run: pnpm test:cov

  # 對真實 MySQL 跑完整 API 流程（Redis 於測試中 mock）
  e2e:
    name: E2E
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ci-e2e-root
          MYSQL_DATABASE: hexagonal_e2e_test
        ports:
          - 3306:3306
        # 判定指令與 compose.yml 的 mysql / mysql-verify 一致。
        # 不可改用固定秒數等待：MySQL 容器要 5–30 秒才完整 ready，
        # 這段期間埠已開但連線會被拒，探埠會誤判為就緒
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # 庫名必須含 test，否則 e2e 的 globalSetup 守門會中止（防誤連 dev / prod）
      DB_TEST_DATABASE: hexagonal_e2e_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      # pnpm install 的 postinstall 只建 symlink，client 仍需自行 generate
      - run: pnpm --filter @app/api db:generate
      - run: pnpm --filter @app/api test:e2e

  # 建置 TypeScript（api + web）。品質未過就不浪費資源建置；
  # e2e 刻意不列入 needs——它較慢，不該阻塞產出，但失敗仍會使整個 workflow 失敗
  #
  # PR 階段也要跑：nest build / vite build 會抓到 path alias 解析、decorator metadata
  # 與 emit 階段的錯誤，這些 tsc --noEmit 抓不到。只在 push 時跑等於「PR 是綠的，
  # 合併完 develop 才紅」——把問題推到最不該爆的地方
  build:
    name: 建置
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - run: pnpm --filter @app/api db:generate
      - run: pnpm build
