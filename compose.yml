# =============================================================================
# 開發與驗證環境（單一檔案）
# -----------------------------------------------------------------------------
# 三種用法，靠「指定服務」與「profile」區分，不需要多份 compose 檔：
#
#   docker compose up -d                    整套跑在容器裡（api + web + mysql + redis）
#   docker compose up -d mysql redis        只起相依服務，api / web 跑在 host
#   docker compose --profile verify up      重現 CI 的 e2e 環境（由 pnpm verify:ci 呼叫）
#
# 對應的 pnpm 指令見 README。verify 的 MySQL 獨立成一個服務而非共用上面那個，
# 因為兩者對資料的要求相反：開發要 named volume 重啟保留，驗證要 tmpfs 每次乾淨。
# 它掛在 profile 底下，平常的 `up` 不會啟動它。
#
# 對外埠一律避開預設的 3306 / 6379——多數開發機已經有一組資料庫在跑。
# 可用 repo 根目錄 .env 的 DEV_DB_PORT / DEV_REDIS_PORT / DEV_DB_PASSWORD 覆寫。
# =============================================================================
name: hexagonal-nest

# api 與 web 共用映像與掛載設定，抽出來避免兩邊漂移
x-app-base: &app-base
  build:
    context: .
    target: dev
  volumes:
    # 原始碼掛進容器，改檔即時生效
    - .:/app
    # node_modules 用具名 volume 蓋掉 bind mount。
    # pnpm 的各 workspace node_modules 是指向根目錄 .pnpm store 的 symlink，
    # **五個位置都要蓋**——漏任何一個，容器就會沿用 host 的 macOS/arm64 產物，
    # 症狀是 bcrypt 或 Prisma 引擎載入失敗（invalid ELF header）。
    #
    # 用具名而非匿名：匿名 volume 在 Docker Desktop 的清單裡只有隨機 hash，
    # 十個混在一起無從辨識、也不知道能不能刪。api 與 web 共用同一組——
    # 同一個映像、同樣的內容，沒必要各存一份（各存一份就是兩份近 1 GB）。
    - node-modules-root:/app/node_modules
    - node-modules-api:/app/apps/api/node_modules
    - node-modules-web:/app/apps/web/node_modules
    - node-modules-api-client:/app/packages/api-client/node_modules
    - node-modules-eslint-config:/app/packages/eslint-config/node_modules
    # 遮蔽 host 的 apps/api/.env：bind mount 會把它一併帶進來，而 dotenv 不覆寫
    # 既有的 process.env，等於「compose 沒設的都由開發者本機的 .env 補」。
    # 其中連線類變數會直接打壞容器——REDIS_URL 指向 host 的 localhost:6379，
    # 容器裡連不到，Redis 會重試到放棄然後降級運行。
    # 遮掉之後設定只有兩個來源：本檔的 environment，與 envSchema 的預設值。
    - ./docker/api.container.env:/app/apps/api/.env:ro
  init: true
  restart: unless-stopped

services:
  api:
    <<: *app-base
    # nest start --watch 在容器內編譯得了、卻換不掉行程：它重啟時舊行程還在跑
    # enableShutdownHooks 的優雅關閉（Prisma pool + Redis quit），新行程搶埠失敗直接死，
    # 症狀是「改了 code 但 API 還是舊行為」——最難察覺的那種壞法。
    # 拆成兩段，各自用對的 watch 機制：
    #   nest build --watch  看 host 改動 → bind mount 不傳 inotify，靠 TSC_WATCHFILE 輪詢
    #   node --watch        看容器自己寫的 dist → 容器內部的寫入事件是通的
    # 另用 nest-cli.docker.json 關掉 deleteOutDir：每次 rebuild 清空 dist 會讓
    # node --watch 在空窗期重啟並 MODULE_NOT_FOUND 後放棄。
    # 先 db:generate 再進 watch：本 command 直接呼叫 concurrently，繞過了 dev script
    # 的 predev，Prisma client 不會被產生，症狀是 Cannot find module '.prisma/client/default'
    command: >
      sh -c "pnpm --filter @app/api db:generate &&
      pnpm --filter @app/api exec concurrently -n build,run -c blue,green
      \"nest build --watch --config nest-cli.docker.json\"
      \"sh -c 'until [ -f dist/main.js ]; do sleep 1; done; exec node --watch --enable-source-maps dist/main'\""
    # 刻意沒有 ports：容器模式的入口只有 nginx。api 提供的東西全在 /api 之下，
    # 而那條在代理的路由表裡，沒有功能因此失去入口
    # （Swagger 走 http://127.0.0.1:8080/api/admin/docs）。
    # 要分辨「代理壞了還是應用壞了」從代理容器內部打後端，比開一個 host 埠更精準
    # ——它涵蓋了代理的網路路徑：
    #   docker compose exec nginx wget -qO- http://api:3000/api/health
    # 要直連請改跑 host 模式：pnpm docker:deps + pnpm dev（3000 / 5173）。
    #
    # 打自己的健康端點，不是檢查行程或埠：容器啟動與「可以接請求」之間有一段實質空窗
    # （nest build 產出 dist/main.js → Prisma 連上 DB → Nest bootstrap 完成），
    # 而 `up -d --wait` 對沒有 healthcheck 的服務**只等到 running**，
    # 會在那段空窗中回報成功，於是 nginx 起來後第一批請求得到 502。
    #
    # start_period 的來歷（**照實記，不要憑感覺調**）：
    #   沒有實測過本專案的冷啟動時間。60s 是餘裕，不是量出來的需求。
    #   代價要知道：應用真的壞掉時，`--wait` 也要等滿 start_period + retries×interval
    #   才會失敗。要調小的話先在自己機器上量一次
    #   （刪掉 apps/api/dist 與 .tsbuildinfo 後重啟，看多久 healthy）。
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
    # 個人的容器覆寫（不存在也不報錯，且不進版控）。
    #
    # **刻意不指向 apps/api/.env**：compose 的 env 解析器比 dotenv 嚴格，
    # 而 `env_file` 解析失敗會讓**所有** docker compose 指令失效——連 `config`、
    # `ps`、`down` 都跑不了。實測踩到：`.env` 有一行 `... <noreply@example.com>`，
    # 對應用程式完全合法，卻讓整個 compose 無法使用。
    # 那個代價遠大於它解決的問題（讓開發者能自訂 LOG_LEVEL 之類）。
    #
    # 優先序：environment > 本檔 > docker/api.container.env > envSchema 預設
    env_file:
      - path: ./apps/api/.env.container
        required: false
    environment:
      NODE_ENV: development
      # ─── 連線類變數一律在此釘死 ───
      # compose 的 environment 優先序最高，host 的 .env 蓋不掉它們。
      # 沒釘死的話會直接採用 host 的值，而那多半指向 localhost，在容器裡連不到。
      # 由 compose-files.spec.ts 的「連線類環境變數必須釘死」守則盯著。
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ${DEV_DB_PASSWORD:-devsecret}
      DB_DATABASE: hexagonal_express_db
      DB_TEST_DATABASE: hexagonal_express_test
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # 開發用假值，長度須滿足 envSchema 的 min(32)。正式環境一律由部署平台注入
      ACCESS_SECRET: dev-only-access-secret-min-32-chars!!
      REFRESH_SECRET: dev-only-refresh-secret-min-32-chars!
      COOKIE_SECRET: dev-only-cookie-secret-min-32-chars!!
      # 即使 STORAGE_DRIVER=local 也必填（envSchema 要求），local 時不會真的用到
      AWS_MEDIA_LIBRARY_ROOT: local
      STORAGE_DRIVER: local
      APP_TIMEZONE: Asia/Taipei
      CORS_ORIGIN: http://localhost:${APP_WEB_PORT:-5173}
      # host 的 .env 常有 REDIS_URL 指向 localhost:6379——容器裡什麼都沒有。
      # 設空字串讓 envSchema 的 optional 生效，改用上面的 REDIS_HOST / REDIS_PORT
      REDIS_URL: ''
      # 對外 URL：容器模式的入口是 nginx，不是 api 自己的埠
      API_BASE_URL: http://localhost:${APP_PROXY_PORT:-8080}
      SMTP_HOST: ''
      SMTP_PORT: '587'
      # 寄進信裡的對外連結。**這類字串在系統內部永遠不會被呼叫**，
      # 所以任何「呼叫自己」的測試都驗不到它——e2e 打的是被測 app 自己的 base，
      # 而錯的正是 base 本身。容器模式的對外位址是代理，不是 api 的埠
      APP_PASSWORD_RESET_URL: http://localhost:${APP_PROXY_PORT:-8080}/reset-password
      # 前面有 nginx，request.ip 必須採信它送來的 X-Forwarded-For。
      # **這一項與 nginx 服務必須一起出現**——少了它，三個功能同時靜默失效：
      #   IP 黑名單     擋不到真正的來源；一旦誤封就是封掉整個 nginx
      #   登入失敗計數   所有人算成同一個，第 N 次失敗把全部人擋掉
      #   全域節流       每分鐘 100 次變成**全站共用**一份額度
      # 用 '1'（信任一跳）而非 'true'：後者會無條件採信偽造的 X-Forwarded-For
      TRUST_PROXY: '1'
      # macOS 的 bind mount 不傳遞 inotify 事件，tsc watch 必須改輪詢才看得到改動
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    <<: *app-base
    command: pnpm --filter @app/web dev
    # 同 api：容器模式的入口只有 nginx。要直連請跑 host 模式
    environment:
      # 容器內 localhost 是 web 自己，proxy 必須指向 api service
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_USE_POLLING: 'true'
    depends_on:
      - api

  # 容器模式的**唯一**入口。api 與 web 都沒有發布埠，所以 docker/nginx/default.conf
  # 的路由表就是「後端有哪些東西對外」的完整清單。
  nginx:
    image: nginx:alpine
    ports:
      - '127.0.0.1:${APP_PROXY_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # 等 api 真的能接請求再起代理：只等到 running 的話第一批請求會得到 502，
      # 而在單一入口的拓撲下那看起來像代理設定壞了。
      # web 只需 running——Vite dev server 沒有 healthcheck
      api: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped

  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_DB_PASSWORD:-devsecret}
      MYSQL_DATABASE: ${DEV_DB_DATABASE:-hexagonal_express_db}
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      # 不帶 -p：mysqladmin ping 在認證失敗時仍會回應，對「MySQL 起來了沒」已足夠，
      # 而帶密碼會讓它在容器內 ps 可見，並持續刷 "password on the command line" 警告
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      # 綁 127.0.0.1：只給本機用，不曝露到區網
      - '127.0.0.1:${DEV_DB_PORT:-3316}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    # 開 AOF：重啟不掉 token 黑名單與快取，省得每次重登
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:${DEV_REDIS_PORT:-6389}:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 只在 `--profile verify` 時啟動；由 pnpm verify:ci 呼叫，跑完即 down -v。
  # 與上面的 mysql 分開而不共用，是因為對資料的要求相反：
  # 這裡要 tmpfs 跑在記憶體——快，而且測試庫本來就該每次拋棄。
  # 與 GitLab CI 的差異刻意保留：GitLab 的 services 不支援 compose 的 healthcheck 語法，
  # CI 端沿用手動等待迴圈，兩邊的 MySQL 版本則一致。
  mysql-verify:
    # 同時屬於兩個 profile：verify 是 host 跑測試（pnpm verify:ci），
    # e2e 是連測試也在容器裡（pnpm test:e2e:docker）。
    # 只掛 verify 的話，`--profile e2e` 啟動時它不在專案裡，
    # e2e 服務的 depends_on 會以 "depends on undefined service" 失敗——
    # 而那個錯誤訊息指向 depends_on，不會讓人想到是 profile
    profiles: [verify, e2e]
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: verify-secret
      MYSQL_DATABASE: hexagonal_verify_test
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    ports:
      - '127.0.0.1:13306:3306'

  # 在容器內跑完整 e2e（--profile e2e）。與 host 的 test:e2e **並存而非取代**：
  #   host  ── 最快，改一行就重跑，開發時用這條
  #   容器  ── 密封，不依賴 host 的 Node / 套件 / .env，推上去之前用這條
  e2e:
    <<: *app-base
    profiles: [e2e]
    # 不需要 restart：跑完就該結束，退出碼即測試的成敗
    restart: 'no'
    # 先 db:generate 再跑測試：Prisma client 產在 node_modules 的具名 volume 裡，
    # 新建的 volume（或剛被清掉重建的）不會有它，症狀是
    # 「Cannot find module '.prisma/client/default'」而所有 spec 全部 failed to run。
    command: >
      sh -c "pnpm --filter @app/api db:generate &&
      pnpm --filter @app/api test:e2e"
    environment:
      NODE_ENV: test
      TZ: UTC
      # 連 service 名稱，不是 127.0.0.1
      DB_HOST: mysql-verify
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: verify-secret
      DB_DATABASE: hexagonal_verify_test
      # **必須給**：applyE2EDbEnv() 會檢查它存在且名稱含 "test"，否則直接拋出。
      # 容器內的 apps/api/.env 是被遮蔽的說明檔，dotenv 只能補值不能當唯一來源
      DB_TEST_DATABASE: hexagonal_verify_test
      AWS_MEDIA_LIBRARY_ROOT: local
      APP_TIMEZONE: Asia/Taipei
    depends_on:
      mysql-verify: { condition: service_healthy }

volumes:
  mysql-data:
  redis-data:
  # node_modules 的具名 volume。**改了依賴後這些不會自動更新**——
  # volume 只在第一次建立時從映像複製內容，之後即使重建映像也沿用舊的。
  # 改 package.json / lockfile 後要 `pnpm docker:reset` 再 `pnpm docker:up`。
  node-modules-root:
  node-modules-api:
  node-modules-web:
  node-modules-api-client:
  node-modules-eslint-config:
